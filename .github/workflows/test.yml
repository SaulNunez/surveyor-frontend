name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholders: the build reads these but never opens a connection.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/surveyor
          NEXTAUTH_SECRET: build-time-placeholder-secret

      # The suite starts its own Postgres container via testcontainers, using the
      # runner's Docker daemon. DATABASE_URL is deliberately not set here.
      - name: Run tests
        run: npm test
